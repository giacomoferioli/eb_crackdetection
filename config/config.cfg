# Playback timing
realtime = false
processing_interval = 1

# Live camera input and EVT3 recording
camera_config_path = config/camera_settings.json
raw_save_path = data/camera_capture.raw

# Pseudoframe settings
max_event_rate = 1000000
pseudoframe_length = 8

# Processing window, in seconds
processing_start = 100
processing_end = 1600

# Image saving window, in seconds
save_interval = 10
saving_start = 100
saving_end = 1600

# Rough distance used only to seed AutoDistance's spacing search.
camera_distance = 250
# Horizontal scale and measured vertical scale at the same reference row.
#pixels_per_mm = 12.05
pixels_per_mm = 6.67904
pixels_per_mm_height = 360
#vertical_pixels_per_mm_reference = 12.1154
vertical_pixels_per_mm_reference = 6.67904
automatic_distortion_compensation = true
displacement_rate = 2
